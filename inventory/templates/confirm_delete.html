{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 60px;">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirm Delete</h5>
        </div>
        <div class="card-body">
            <p class="fs-5">Are you sure you want to delete this <strong>{{ type }}</strong>?</p>
            <div class="alert alert-warning"><strong>{{ object }}</strong></div>
            <p class="text-muted small">This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end">
                    <a href="javascript:history.back()" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
